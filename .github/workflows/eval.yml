name: eval

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (deterministic path only)
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Regression gate (deterministic, reproducible, $0)
        run: python run.py --fake-embed --gate
      - name: Access-scoped retrieval (fails on any clearance leak)
        run: python run.py --fake-embed --access
      - name: Grounded vs ungrounded false-answer rate
        run: python run.py --fake-embed --compare